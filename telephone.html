<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SEB-MULTIGYRO-BATTERIE — téléphone</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SEB-MULTIGYRO-BATTERIE">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<style>
  :root { --fond: #111; --texte: #eee; --gc: #e8643c; --cy: #e8c43c; --doux: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px -apple-system, system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 14px; -webkit-user-select: none; user-select: none; }
  h1 { font-size: 20px; margin: 0; }
  #etat { color: var(--doux); font-size: 14px; }
  #etat.ok { color: #6c6; }
  button { font: inherit; font-size: 20px; padding: 18px; border: 0; border-radius: 12px; background: #2a6; color: #fff; }
  button.secondaire { font-size: 15px; padding: 12px; background: #2a2a2a; color: var(--texte); }
  #flash { flex: 1; min-height: 160px; border-radius: 16px; background: #1c1c1c; display: flex; align-items: center;
           justify-content: center; font-size: 28px; font-weight: 600; transition: background .25s; }
  .jauges { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--doux); }
  .jauge { height: 10px; background: #222; border-radius: 5px; position: relative; overflow: hidden; }
  .jauge i { position: absolute; top: 0; bottom: 0; left: 50%; background: #48f; }
  label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--doux); }
  select, input[type=range] { flex: 1; font: inherit; }
  .reglages { display: flex; flex-direction: column; gap: 10px; }
  #gain { font-size: 12px; color: var(--doux); }
  /* Écran noir verrouillé : rien d'autre que du noir (presque aucune consommation sur un écran OLED), touchers ignorés */
  #ecranNoir { position: fixed; inset: 0; z-index: 50; background: #000; touch-action: none; display: flex; align-items: flex-end;
               justify-content: center; padding-bottom: 48px; -webkit-touch-callout: none; }
  #ecranNoir[hidden] { display: none; }
  #indiceNoir { color: #1c1c1c; font-size: 13px; transition: color .2s; }
  .cartouche { margin-top: 8px; border-top: 1px solid #2a2a2a; text-align: center; color: var(--doux); font-size: 12px; letter-spacing: .12em; line-height: 1.7; padding: 10px 0 0; }
  .cartouche a { color: #a9b6ff; text-decoration: underline; text-underline-offset: 3px; }
  .cartouche { margin-top: 8px; border-top: 1px solid #2a2a2a; text-align: center; color: var(--doux); font-size: 12px; letter-spacing: .12em; line-height: 1.7; padding: 10px 0 0; }
  .cartouche a { color: #a9b6ff; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<h1 id="titre">SEB-MULTIGYRO-BATTERIE</h1>
<div id="etat">Non connecté</div>
<button id="demarrer">Démarrer</button>
<div id="flash">—</div>
<div class="jauges">
  <span>1</span><div class="jauge"><i id="j0"></i></div>
  <span>2</span><div class="jauge"><i id="j1"></i></div>
  <span>3</span><div class="jauge"><i id="j2"></i></div>
</div>
<div class="reglages">
  <button id="calibrer" class="secondaire">Refaire la calibration (2 coups vers le bas, 2 vers le haut)</button>
  <label>Sensibilité <input type="range" id="seuil" min="0" max="100" step="1"> <span id="vseuil"></span></label>
  <label><input type="checkbox" id="precoce"> Déclenchement précoce (dès le début du geste)</label>
  <div id="gain"></div>
  <button id="noir" class="secondaire">Écran noir verrouillé (appui long 2 s pour revenir)</button>
</div>

<div id="ecranNoir" hidden><div id="indiceNoir">appui long 2 s pour revenir</div></div>
<footer class="cartouche">SEB-MULTIGYRO-BATTERIE · Sébastien Gay · Octobre 2026 · <a href="https://github.com/SEB102/seb-multigyro-batterie#readme" target="_blank" rel="noopener">Mode d'emploi</a> · <a href="https://github.com/SEB102/seb-multigyro-batterie/blob/main/LICENSE" target="_blank" rel="noopener">Licence CC BY-NC 4.0</a><br>Connexion : <a href="https://peerjs.com" target="_blank" rel="noopener">PeerJS</a> (MIT) · QR code : <a href="https://github.com/kazuhikoarase/qrcode-generator" target="_blank" rel="noopener">qrcode-generator</a> par Kazuhiko Arase (MIT)</footer>
<div id="version" style="font-size:11px;color:#555">version 2026-10-21n</div>
<script>
// Toute erreur s'affiche à l'écran (pas de console sur un téléphone)
const montrerErreur = (m) => { const e = document.getElementById('etat'); e.textContent = 'Erreur : ' + m; e.className = ''; e.style.color = '#e66'; };
window.onerror = (msg, src, ligne) => montrerErreur(`${msg} (${(src || '').split('/').pop()}:${ligne})`);
window.onunhandledrejection = (e) => montrerErreur(e.reason && e.reason.message || e.reason);
</script>
<script src="detecteur.js?v=20261021n"></script>
<script src="peerjs.min.js?v=20261021n"></script>
<script src="liaison.js?v=20261021n"></script>
<script>
const $ = (id) => document.getElementById(id);
const memo = (() => { try { return JSON.parse(localStorage.getItem('gyro-batterie') || '{}'); } catch { return {}; } })();
// sensibilité par défaut : 80 % (remise une fois à 80 % pour tous, puis réglable comme avant)
const SEUIL_DEFAUT = Detecteur.sensibiliteVersSeuil(80);
const reglages = { seuil: memo.defaut80 ? memo.seuil : SEUIL_DEFAUT, defaut80: true, calibration: memo.calibration || null, precoce: !!memo.precoce };
const sauver = () => { try { localStorage.setItem('gyro-batterie', JSON.stringify(reglages)); } catch {} };

// Sensibilité : réglable ici ou depuis l'ordinateur (curseur à droite = gestes plus légers)
let detecteur;
// Déclenchement précoce : le détecteur mesure à chaque coup le temps gagné sur le sommet du geste
const gains = [];
function afficherGain() {
  const moy = gains.reduce((a, b) => a + b, 0) / (gains.length || 1);
  $('gain').textContent = !reglages.precoce ? ''
    : gains.length ? `Gain mesuré : ${Math.round(moy)} ms plus tôt qu'au sommet du geste (moyenne sur ${gains.length} coup${gains.length > 1 ? 's' : ''})`
    : 'Gain mesuré : frappe pour le mesurer';
}
function noterGain(ms) { gains.push(ms); if (gains.length > 20) gains.shift(); afficherGain(); }
function appliquerSeuil(seuil) {
  reglages.seuil = seuil; sauver();
  detecteur = Detecteur.creerDetecteur({ seuil, precoce: reglages.precoce, surGain: noterGain });
  const p = Detecteur.seuilVersSensibilite(seuil);
  $('seuil').value = p; $('vseuil').textContent = p + ' %';
}
appliquerSeuil(reglages.seuil);
$('seuil').oninput = (e) => appliquerSeuil(Detecteur.sensibiliteVersSeuil(Number(e.target.value)));
$('precoce').checked = reglages.precoce; afficherGain();
$('precoce').onchange = (e) => { reglages.precoce = e.target.checked; gains.length = 0; appliquerSeuil(reglages.seuil); afficherGain(); };

// Ce que l'ordinateur envoie : réglage de sensibilité, et (version multi) l'instrument de ce téléphone
let affichage = null;   // { numero, couleur, noms: [son 1, son 2] }
function surMessage(d) {
  if (d.reglage && typeof d.reglage.seuil === 'number') appliquerSeuil(d.reglage.seuil);
  if (d.affichage) {
    affichage = d.affichage;
    $('titre').textContent = `Téléphone ${affichage.numero} · ${[...new Set(affichage.noms)].join(' / ')}`;
    $('titre').style.color = affichage.couleur;
  }
}

let liaison = null;
const envoyer = (o) => liaison && liaison.envoyer(o);
const etat = (texte, ok) => { $('etat').textContent = texte; $('etat').className = ok ? 'ok' : ''; };

// ---- Lecture du capteur, quel que soit le téléphone ----
// Gyroscope si présent ; sinon accéléromètre (sans gravité, ou avec gravité retirée par un filtre).
let gravite = null;
function lireAxes(e) {
  const r = e.rotationRate;
  if (r && [r.alpha, r.beta, r.gamma].some((v) => typeof v === 'number')) return { source: 'gyro', axes: [r.alpha || 0, r.beta || 0, r.gamma || 0] };
  const a = e.acceleration;
  if (a && typeof a.x === 'number') return { source: 'accel', axes: [a.x, a.y || 0, a.z || 0] };
  const g = e.accelerationIncludingGravity;
  if (g && typeof g.x === 'number') {
    const brut = [g.x, g.y || 0, g.z || 0];
    gravite = gravite ? gravite.map((v, i) => 0.9 * v + 0.1 * brut[i]) : brut;
    return { source: 'accelg', axes: brut.map((v, i) => v - gravite[i]) };
  }
  return null;
}

// ---- Calibration guidée : 2 coups vers le BAS, puis 2 vers le HAUT, en tenant le téléphone comme pour jouer ----
// Comme l'app sait dans quel sens va chaque coup, elle apprend quel sens de rotation du poignet veut dire « bas »
// (et dans quel sens), et elle vérifie que les 4 coups sont tous bien classés ; sinon elle recommence.
const SENS_CALIBRATION = [-1, -1, 1, 1], DUREE_MAX_CALIBRATION = 15000;
let calibration = null;   // { debut, echantillons, coups, fin } pendant la calibration
function afficherCalibration(titre, detail) {
  const n = calibration ? calibration.coups : 0;
  const fleches = SENS_CALIBRATION.map((s, i) => `<span style="opacity:${i < n ? 0.35 : 1}">${s < 0 ? '↓' : '↑'}</span>`).join(' ');
  $('flash').innerHTML = `<div style="font-size:20px;line-height:1.5">${titre}<br><span style="font-size:15px;font-weight:400;color:#bbb">${detail}</span>`
    + `<div style="font-size:34px;letter-spacing:.2em;margin-top:10px">${fleches}</div></div>`;
}
function consigne(n) {   // n coups déjà reconnus
  if (n >= SENS_CALIBRATION.length) return ['4 coups reconnus', 'un instant…'];
  return [`Coup ${n + 1} sur 4 : vers le ${SENS_CALIBRATION[n] < 0 ? 'BAS ↓' : 'HAUT ↑'}`, 'un coup sec, en tenant le téléphone comme pour jouer'];
}
function lancerCalibration(apres = 0) {
  calibration = { debut: performance.now() + apres, echantillons: [], coups: 0, fin: null };
  $('flash').style.background = '#234'; $('flash').style.color = '';
  if (!apres) afficherCalibration(...consigne(0));
}
function suivreCalibration(lu, t, e) {
  if (t < calibration.debut) return;   // pause après un essai raté, le message reste affiché
  const c = calibration;
  if (!c.echantillons.length) afficherCalibration(...consigne(0));
  c.echantillons.push({ t, axes: lu.axes, rot: e.rotationRate, acc: e.acceleration, accG: e.accelerationIncludingGravity });
  if (c.echantillons.length % 4 === 0) {
    const n = Math.max(c.coups, Detecteur.compterCoups(c.echantillons));   // ne recule jamais à l'écran
    if (n !== c.coups) {
      c.coups = Math.min(n, SENS_CALIBRATION.length);
      afficherCalibration(...consigne(c.coups));
      if (n >= SENS_CALIBRATION.length && !c.fin) c.fin = t + 400;   // laisser finir le dernier geste
    }
  }
  if (!(c.fin && t >= c.fin) && t - c.debut < DUREE_MAX_CALIBRATION) return;
  const res = Detecteur.calibrer(c.echantillons);
  const sensRotation = res && Detecteur.calibrerSensRotation(c.echantillons, res, SENS_CALIBRATION);
  if (!sensRotation) {
    afficherCalibration('Pas assez net', '2 coups francs vers le BAS, puis 2 vers le HAUT ; on recommence…');
    lancerCalibration(2500);
    return;
  }
  reglages.calibration = { ...res, source: lu.source, sensRotation }; sauver();
  calibration = null;
  $('flash').style.background = '';
  $('flash').textContent = 'Calibré ! À toi de jouer';
}

// ---- Jeu ----
let dernierEnvoi = 0, timerFlash, maxAxes = [1, 1, 1], recu = false;
function surMouvement(e) {
  const lu = lireAxes(e); if (!lu) return;
  recu = true;
  const t = performance.now();
  lu.axes.forEach((v, i) => {   // jauges : chaque axe relativement à son maximum
    maxAxes[i] = Math.max(maxAxes[i], Math.abs(v));
    const n = v / maxAxes[i], el = $('j' + i);
    el.style.left = (n < 0 ? 50 + n * 50 : 50) + '%'; el.style.width = Math.abs(n) * 50 + '%';
  });
  if (calibration) return suivreCalibration(lu, t, e);
  const cal = reglages.calibration;
  // une calibration d'avant la version guidée (sans sens de rotation appris) est refaite une fois
  if (!cal || cal.source !== lu.source || !cal.sensRotation) return lancerCalibration();

  const vitesse = lu.axes[cal.axe] * cal.signe * cal.facteur;
  const coup = detecteur.traiter(vitesse, t);
  if (coup) {
    // coup vers le bas → grosse caisse (son 1), vers le haut → cymbale (son 2) : sens de rotation du poignet appris à la calibration
    const son = (coup.type === 'grosse-caisse' ? -1 : 1) * cal.sensRotation < 0 ? 'grosse-caisse' : 'cymbale';
    envoyer({ coup: son, force: coup.force });
    const gc = son === 'grosse-caisse';
    $('flash').textContent = affichage ? affichage.noms[gc ? 0 : 1].toUpperCase() : gc ? 'GROSSE CAISSE' : 'CYMBALE';
    $('flash').style.background = affichage ? affichage.couleur : gc ? 'var(--gc)' : 'var(--cy)';
    $('flash').style.color = '#111';
    clearTimeout(timerFlash);
    timerFlash = setTimeout(() => { $('flash').style.background = ''; $('flash').style.color = ''; }, 150);
  }
  if (t - dernierEnvoi > 30) { dernierEnvoi = t; envoyer({ v: Math.round(vitesse), seuil: reglages.seuil }); }
}
$('calibrer').onclick = () => lancerCalibration();

// Autorisation des mouvements : l'iPhone exige un toucher ; Chrome a la même fonction mais accepte
// en général sans toucher. On essaie donc sans, et le bouton ne sert que si le navigateur refuse.
const autorisationDemandee = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
let demarre = false;
// Une promesse qui ne répond jamais (certains navigateurs) ne doit pas tout bloquer
const auPlusTard = (promesse, ms, valeur) => Promise.race([promesse, new Promise((r) => setTimeout(() => r(valeur), ms))]);

async function demarrer(parToucher) {
  if (demarre) return;
  if (typeof DeviceMotionEvent === 'undefined') return mouvements('Ce navigateur ne donne pas accès aux mouvements');
  if (autorisationDemandee) {
    if (parToucher) $('demarrer').textContent = 'Autorisation…';
    let rep;
    try { rep = await auPlusTard(DeviceMotionEvent.requestPermission(), parToucher ? 15000 : 1500, 'sans réponse'); }
    catch (err) { rep = 'erreur : ' + (err && err.message); }
    if (rep !== 'granted') {
      $('demarrer').textContent = 'Toucher pour démarrer';
      if (parToucher) mouvements(rep === 'denied'
        ? 'Mouvements refusés : fermer l\'onglet, le rouvrir, puis Autoriser'
        : 'Autorisation des mouvements : ' + rep);
      return;
    }
  }
  demarre = true;
  window.addEventListener('devicemotion', surMouvement);
  garderEcranAllume();
  $('demarrer').style.display = 'none';
  $('flash').textContent = reglages.calibration ? 'Frappe !' : '…';
  setTimeout(() => { if (!recu) mouvements('Aucun mouvement reçu du capteur'); }, 2500);
}
const mouvements = (texte) => { $('flash').textContent = texte; $('flash').style.fontSize = '18px'; };
$('demarrer').onclick = () => demarrer(true);

// La connexion n'attend pas l'autorisation des mouvements : elle part dès l'ouverture
liaison = Liaison.telephone({ surEtat: etat, surMessage });
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
if (ios) $('demarrer').textContent = 'Toucher pour démarrer';   // ne pas risquer un refus mémorisé
else demarrer(false);

// ---- Écran allumé pendant le jeu : l'iPhone relâche ce verrou dès que la page passe en arrière-plan,
// on le redemande quand elle revient (sinon l'écran s'éteint et les mesures s'arrêtent) ----
function garderEcranAllume() { try { navigator.wakeLock.request('screen').catch(() => {}); } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && demarre) garderEcranAllume(); });

// ---- Écran noir verrouillé : on continue de jouer, les touchers sont ignorés ; appui long de 2 s pour revenir ----
const DUREE_DEVERROUILLAGE = 2000;
let minuterieNoir = null;
$('noir').onclick = () => {
  if (!demarre) return mouvements('Démarre d\'abord (bouton du haut)');
  $('ecranNoir').hidden = false;
};
const annulerDeverrouillage = () => { clearTimeout(minuterieNoir); minuterieNoir = null; $('indiceNoir').style.color = ''; };
$('ecranNoir').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  annulerDeverrouillage();
  $('indiceNoir').style.color = '#666';   // on voit que l'appui est pris en compte
  minuterieNoir = setTimeout(() => { annulerDeverrouillage(); $('ecranNoir').hidden = true; }, DUREE_DEVERROUILLAGE);
});
for (const type of ['pointerup', 'pointercancel', 'pointerleave']) $('ecranNoir').addEventListener(type, annulerDeverrouillage);
for (const type of ['touchstart', 'touchmove', 'contextmenu']) $('ecranNoir').addEventListener(type, (e) => e.preventDefault(), { passive: false });
</script>
</body>
</html>
